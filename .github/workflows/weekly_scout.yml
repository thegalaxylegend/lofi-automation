name: Weekly Competitor Scout

on:
  schedule:
    # Run every Monday at 02:00 UTC (7:30 AM IST)
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scout scan
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          python -c "
          import os
          from core.memory import initialize_all_memories
          from agents.scout import Scout
          from core.discord_webhook import DiscordNotifier
          import json
          
          initialize_all_memories()
          scout = Scout()
          report = scout.scan(youtube_api_key=os.environ.get('YOUTUBE_API_KEY', ''))
          
          if 'error' not in report:
              notifier = DiscordNotifier()
              msg = f'**Trending Keywords:** {\", \".join(report.get(\"trending_keywords\", [])[:5])}\n'
              msg += f'**Recommendation:** {report.get(\"recommendation\", \"N/A\")}'
              notifier.notify_alert('\u{1F575}\uFE0F Scout Intelligence Report', msg, level='info')
          "

      - name: Commit updated memory
        run: |
          git config user.name "Lo-fi Bot"
          git config user.email "bot@moodwire.dev"
          git add memory/*.json
          git diff --cached --quiet || git commit -m "🕵️ Weekly scout update [skip ci]"
          git push
